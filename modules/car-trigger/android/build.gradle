plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cartrigger'
version = '0.1.0'

android {
  namespace "expo.modules.cartrigger"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // HeadlessJsTaskService, Arguments
  implementation 'com.facebook.react:react-android'
}
